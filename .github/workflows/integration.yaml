name: Integration

# Runs an app against a real deployment: tests/integration.
#
# The deployment is built by konstruktor (https://github.com/arkitektio/konstruktor) --
# a self-contained hub, services and a coordination server of their own, that nobody has
# to accept -- through the pytest fixture its Python package ships. Nothing in this
# repository knows what a deployment consists of. konstruktor comes with the dev
# dependencies, so the same tests also run wherever `uv run pytest` does and Docker is.
#
# Kept as a job of its own for what the test matrix does not say: the result on arm64,
# and against the builds named in KONSTRUKTOR_IMAGES.
on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  test_integration:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Which builds of the services to run against, when it should not be `latest`:
      # `rekuest=jhnnsrs/rekuest:1.2.3,mikro=jhnnsrs/mikro:6.1.0`. konstruktor reads it;
      # left empty, a hub runs what a new hub always runs.
      KONSTRUKTOR_IMAGES: ${{ vars.KONSTRUKTOR_IMAGES }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run the integration tests
        run: uv run pytest -m integration -rs

      - name: Containers at failure
        if: failure()
        run: docker ps -a
