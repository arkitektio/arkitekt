name: Release an Arkitekt app
description: >
  Test, build and publish an Arkitekt app to an OCI repository. A commit tagged with the
  app's version becomes that release; any other commit becomes the latest build of its
  branch's channel.

# Everything this does is `arkitekt plugin release`. The steps around it only give that
# command what any CI has to: a logged-in docker, emulation for the other platforms, and
# the name of the branch.

inputs:
  repository:
    description: The OCI repository to publish to. Others import it to install the app.
    default: ghcr.io/${{ github.repository }}
  registry:
    description: The registry to log in to.
    default: ghcr.io
  username:
    description: The account to log in to the registry with.
    default: ${{ github.actor }}
  password:
    description: "Its password or token. The workflow's own token needs the packages write permission."
    default: ${{ github.token }}
  target:
    description: "The app to release, as module[:attr]."
    default: app
  arkitekt:
    description: How to call the arkitekt CLI in this project.
    default: uv run arkitekt
  arguments:
    description: Further arguments for `arkitekt plugin release`.
    default: ""
  release:
    description: >
      "true" when an earlier step of the job tagged this commit with the app's version
      (semantic-release does): it is then published as that release, though the push
      that started the job was one to a branch.
    default: "false"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
    - uses: docker/setup-qemu-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    - shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        ARKITEKT: ${{ inputs.arkitekt }}
        TARGET: ${{ inputs.target }}
        ARGUMENTS: ${{ inputs.arguments }}
        RELEASE: ${{ inputs.release }}
      run: |
        # A repository path is lowercase; an owner's name need not be.
        export ARKITEKT_REPOSITORY="${REPOSITORY,,}"
        # A push to a branch is a build of that branch, also when its commit is tagged:
        # the tag's own push is what releases it. Unless the job itself made the tag.
        if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$RELEASE" != "true" ]; then export ARKITEKT_CHANNEL="$GITHUB_REF_NAME"; fi
        $ARKITEKT plugin release "$TARGET" $ARGUMENTS
    # A release also moves its major's channel: `<major>-<flavour>` (`0.<minor>-<flavour>`
    # before 1.0) names the same image as `<version>-<flavour>`. Whoever runs the app follows
    # that tag and pins the build it resolved to, so a fix reaches them without a release of
    # their own, and a breaking one never does. A build of a branch, or a pre-release, moves
    # nothing.
    - shell: bash
      if: inputs.release == 'true' || github.ref_type == 'tag'
      env:
        REPOSITORY: ${{ inputs.repository }}
      run: |
        repository="${REPOSITORY,,}"
        version="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
        version="${version#v}"
        case "$version" in
          "" | *-* | *+*) echo "No release version on this commit: no channel moves."; exit 0 ;;
        esac
        major="${version%%.*}"
        if [ "$major" = "0" ]; then minor="${version#0.}"; major="0.${minor%%.*}"; fi
        for folder in .arkitekt/flavours/*/; do
          flavour="$(basename "$folder")"
          docker buildx imagetools create --tag "$repository:$major-$flavour" "$repository:$version-$flavour"
          echo "$repository:$major-$flavour -> $version-$flavour"
        done
