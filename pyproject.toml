[project]
name = "arkitekt"
dynamic = ["version"]
description = "client for the arkitekt platform"
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "fakts>=2",
    "koil>=3.3.2",
    "rath>=3.12.0",
    "click>=8.2.0",
    "typer>=0.15.0",
    "rekuest>=3",
    "kabinet>=2",
    "semver>=3.0.4",
    "watchfiles>=1.0.5",
    "turms>=2.0.0",
    "platformdirs>=4.5.0",
    "py-machineid>=0.8.1",
    # Used eagerly by the base CLI (config/manifest/plugin IO), so it stays core.
    "pyyaml>=6.0.2",
    # The mesh commands drive the well-known/device-code flow over aiohttp.
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# Historical no-op alias: the CLI (typer, turms) is part of the core install now.
# Kept so `pip install "arkitekt[cli]"` in old docs/scripts stays valid.
cli = []
alpaka = [
    "alpaka>=1.0.0",
]
kraph = [
    "kraph>=0.5.1",
]
mikro = [
    "mikro>=3",
]
# Historical no-op alias: kabinet is a core dependency (the plugin commands use it).
kabinet = []
elektro = [
    "elektro>=2.0.0",
]
fluss = [
    "fluss>=2",
]
lovekit = [
    "lovekit>=1.2.1",
]
unlok = [
    "unlok-next>=1.3.1",
]
# Qt integration (arkitekt.qt / the MagicBar). qtpy still needs an actual
# binding (PyQt5/6 or PySide2/6) supplied by the application.
qt = [
    "qtpy>=2.4.3",
]
all = [
    # Self-referential extras keep `all` complete without duplicating (and drifting)
    # version pins. Bundles every service client; the CLI is always included.
    "arkitekt[mikro,kabinet,elektro,fluss,unlok]",
]
extended = [
    "kraph>=0.5.1",
    "alpaka>=1.0.0",
]

[project.scripts]
arkitekt = "arkitekt.cli.main:cli"

[tool.uv]
dev-dependencies = [
    "autoflake>=1.7.7,<2",
    "ruff>=0.8",
    "basedpyright>=1.21",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.20.2,<0.21",
    "pytest-cov>=4.0.0,<5",
    "pytest-aiohttp>=1.0.4,<2",
    "mikro>=3",
    "python-semantic-release>=9.21.1",
    "qtpy>=2.4.3",
    "numpy>=1,<2",
    "rekuest>=3",
    "kabinet>=2",
    "alpaka>=1.0.0",
    "kraph>=0.5.1",
    "fluss>=2",
    "lovekit>=1.2.1",
    "unlok-next>=1.3.1",
    "elektro>=2.0.0",
]


[tool.hatch.build.targets.sdist]
include = ["arkitekt"]

[tool.hatch.build.targets.wheel]
include = ["arkitekt"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is derived from the nearest git tag (vX.Y.Z); nothing in the
# tree is bumped on release. Shallow CI clones see no tag and get the fallback.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.mypy]
exclude = ["venv/"]
ignore_missing_imports = true

[tool.ruff]
extend-select = ["ANN", "D1"]
extend-ignore = ["ANN101", "ANN002", "ANN003"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 100

[tool.pytest.ini_options]
markers = [
    "qt: marks tests that require a running qt application",
    "cli: marks tests that require a running cli",
    "needs_docker: marks tests that require a running docker daemon",
]



[tool.semantic_release]
# No version_toml/version_variables: the release version lives only in the git
# tag, which hatch-vcs reads at build time. CI runs the version command with
# `commit: false`, so PSR tags HEAD and creates the GitHub Release without
# pushing a bump commit to the branch.
#
# The semantic-release GitHub Action runs in a Docker container without uv, so
# install it first. PSR builds *before* it tags, so hatch-vcs is told the new
# version explicitly ($NEW_VERSION is injected by PSR) instead of deriving a
# `.devN+g...` local version that PyPI would reject.
build_command = """
    python -m pip install 'uv>=0.7.12'
    export SETUPTOOLS_SCM_PRETEND_VERSION="$NEW_VERSION"
    uv build
"""

# main -> stable X.Y.Z. next -> prereleases X.Y.Z-rc.N. N.x -> maintenance.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.next]
match = "next"
prerelease = true
prerelease_token = "rc"

# Maintenance branches (1.x, 2.x, ...) cut stable patch/minor releases for an
# older major after a new major has shipped from main.
[tool.semantic_release.branches.maintenance]
match = '^\d+\.x$'
prerelease = false

# Keep the changelog focused on user-facing changes. These patterns only filter
# what's rendered — they do not affect version bumps.
[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '^chore(?:\([^)]*\))?: ',
    '^ci(?:\([^)]*\))?: ',
    '^build(?:\([^)]*\))?: ',
    '^style(?:\([^)]*\))?: ',
    '^test(?:\([^)]*\))?: ',
    '^Merge ',
]

