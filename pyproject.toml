[project]
name = "arkitekt-next"
version = "1.4.2"
description = "client for the arkitekt_next platform"
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "fakts-next>=5.0.0,<6",
    "koil>=3.3.2",
    "rath>=3.12.0",
    "click>=8.2.0",
    "typer>=0.15.0",
    "rekuest-next>=2.1.0",
    "kabinet>=1.0.3",
    "semver>=3.0.4",
    "watchfiles>=1.0.5",
    "turms>=2.0.0",
    "platformdirs>=4.5.0",
    "py-machineid>=0.8.1",
    # Used eagerly by the base CLI (config/manifest/plugin IO), so it stays core.
    "pyyaml>=6.0.2",
    # The mesh commands drive the well-known/device-code flow over aiohttp.
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# Historical no-op alias: the CLI (typer, turms) is part of the core install now.
# Kept so `pip install "arkitekt-next[cli]"` in old docs/scripts stays valid.
cli = []
alpaka = [
    "alpaka>=1.0.0",
]
kraph = [
    "kraph>=0.5.1",
]
mikro = [
    "mikro-next>=2.1.0",
]
# Historical no-op alias: kabinet is a core dependency (the plugin commands use it).
kabinet = []
elektro = [
    "elektro>=2.0.0",
]
fluss = [
    "fluss-next>=1.0.0",
]
reaktion = [
    "reaktion-next>=0.4.1",
]
lovekit = [
    "lovekit>=1.2.1",
]
unlok = [
    "unlok-next>=1.3.1",
]
# Qt integration (arkitekt_next.qt / the MagicBar). qtpy still needs an actual
# binding (PyQt5/6 or PySide2/6) supplied by the application.
qt = [
    "qtpy>=2.4.3",
]
all = [
    # Self-referential extras keep `all` complete without duplicating (and drifting)
    # version pins. Bundles every service client; the CLI is always included.
    "arkitekt-next[mikro,kabinet,elektro,fluss,reaktion,unlok]",
]
extended = [
    "kraph>=0.5.1",
    "alpaka>=1.0.0",
]
# Installed inside the semantic-release Docker action so build_command has uv.
build = ["uv>=0.7.12"]

[project.scripts]
arkitekt-next = "arkitekt_next.cli.main:cli"

[tool.uv.sources]
# Dev-time only: the selector CLI targets the kabinet 2.x client (discriminated
# SelectorInput union). TODO: drop once that kabinet release is on PyPI.
kabinet = { path = "../../packages/kabinet", editable = true }
# fakts-next>=5 exists only locally (PyPI stops at 4.1.0).
fakts-next = { path = "../../packages/fakts-next", editable = true }
rekuest-next = { path = "../../packages/rekuest-next", editable = true }

[tool.uv]
# fakts-next 5 is only published as a release candidate so far.
prerelease = "allow"
dev-dependencies = [
    "autoflake>=1.7.7,<2",
    "ruff>=0.8",
    "basedpyright>=1.21",
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.20.2,<0.21",
    "pytest-cov>=4.0.0,<5",
    "pytest-aiohttp>=1.0.4,<2",
    "mikro-next>=2.1.0",
    "python-semantic-release>=9.21.1",
    "qtpy>=2.4.3",
    "numpy>=1,<2",
    "rekuest-next>=0.13.1",
    "kabinet>=1.0.1",
    "alpaka>=1.0.0",
    "kraph>=0.5.1",
    "fluss-next>=1.0.0",
    "lovekit>=1.2.1",
    "unlok-next>=1.3.1",
    "reaktion-next>=0.4.1",
    "elektro>=2.0.0",
]


[tool.hatch.build.targets.sdist]
include = ["arkitekt_next"]

[tool.hatch.build.targets.wheel]
include = ["arkitekt_next"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
exclude = ["venv/"]
ignore_missing_imports = true

[tool.ruff]
extend-select = ["ANN", "D1"]
extend-ignore = ["ANN101", "ANN002", "ANN003"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 100

[tool.pytest.ini_options]
markers = [
    "qt: marks tests that require a running qt application",
    "cli: marks tests that require a running cli",
    "needs_docker: marks tests that require a running docker daemon",
]

[[tool.pydoc-markdown.loaders]]
type = "python"
search_path = ["arkitekt_next"]

[tool.pydoc-markdown.renderer]
type = "docusaurus"
docs_base_path = "website/docs"


[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
# The semantic-release GitHub Action runs in a Docker container without uv, so
# install it first (the `build` extra). After PSR bumps the version in
# pyproject.toml, re-sync just this package's entry in uv.lock and stage it so
# the release commit carries a consistent lock. $PACKAGE_NAME is injected by PSR.
build_command = """
    python -m pip install -e '.[build]'
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""
commit_message = "chore(release): v{version} [skip ci]"

# main -> stable X.Y.Z. next -> prereleases X.Y.Z-rc.N. N.x -> maintenance.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.next]
match = "next"
prerelease = true
prerelease_token = "rc"

# Maintenance branches (1.x, 2.x, ...) cut stable patch/minor releases for an
# older major after a new major has shipped from main.
[tool.semantic_release.branches.maintenance]
match = '^\d+\.x$'
prerelease = false

# Keep the changelog focused on user-facing changes. These patterns only filter
# what's rendered — they do not affect version bumps.
[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '^chore(?:\([^)]*\))?: ',
    '^ci(?:\([^)]*\))?: ',
    '^build(?:\([^)]*\))?: ',
    '^style(?:\([^)]*\))?: ',
    '^test(?:\([^)]*\))?: ',
    '^Merge ',
]

